              <Setting name="Disable update footer">0</Setting>
              <Setting name="Highest shown overlay id">0</Setting>
              <Setting name="Resolve local symlinks" platform="win">1</Setting>
              <Setting name="Last automatic update check">2026-08-01 16:10:56</Setting>
              <Setting name="Greeting version">3.99.9</Setting>
              <Setting name="Prompt password save">1</Setting>
              <Setting name="Last automatic update version">3.99.9</Setting>
              <Setting name="Queue column widths">180 60 180 80 60 150</Setting>
              <Setting name="Local filelist colwidths">170 80 120 120</Setting>
              <Setting name="Remote filelist colwidths">150 75 80 100 80 85</Setting>
              <Setting name="Window position and size">0 360 41 1184 840 </Setting>
              <Setting name="Local filelist shown columns">1111</Setting>
              <Setting name="Remote filelist shown columns">111111</Setting>
              <Setting name="Local filelist column order">0,1,2,3</Setting>
              <Setting name="Remote filelist column order">0,1,2,3,4,5</Setting>
              <Setting name="Local filelist sortorder">0 0</Setting>
              <Setting name="Remote filelist sortorder">0 0</Setting>
              <Setting name="Update Check">0</Setting>
              <Setting name="Number of Transfers">10</Setting>
              <Setting name="Time Format">0</Setting>
              <Setting name="Date Format">0</Setting>
              <Setting name="Default editor" platform="win">0</Setting>
              <Setting name="Splitter positions (v2)">97 -632 500000000 50 50 500000000</Setting>
              <Setting name="Tab data" sensitive="1">
                <Tabs>
                  <Tab selected="1">
                    <Host />
                    <Port>21</Port>
                    <Protocol>-1</Protocol>
                    <Logontype>0</Logontype>
                    <BypassProxy>0</BypassProxy>
                    <Site></Site>
                    <RemotePath></RemotePath>
                    <LocalPath>C:\Users\__RDP_USER__\</LocalPath>
                  </Tab>
                </Tabs>
              </Setting>
            </Settings>
          </FileZilla3>
          '@
          $fzXml.Replace("__RDP_USER__", $env:RDP_USER) | Out-File -FilePath "C:\filezilla.xml" -Encoding utf8

          # 2. layout.xml
          @'
          <?xml version="1.0"?>
          <FileZilla3 version="3.71.1" platform="windows">
            <Layout Builddate="2026-06-04" Buildtime="14:53:46">
              <Resources />
              <Language id="en_US" date="1780584876">
                <Font font="1;9;-12;0;0;0;400;0;0;0;1;0;0;5;0;Segoe UI" width="669" height="15" />
                <Dialog name="Settings" width="449" />
              </Language>
            </Layout>
          </FileZilla3>
          '@ | Out-File -FilePath "C:\layout.xml" -Encoding utf8

      - name: Setup Auto Launcher saat Login RDP
        shell: pwsh
        run: |
          $startupDir = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          New-Item -ItemType Directory -Force -Path $startupDir

          $batContent = @'
          @echo off
          timeout /t 2 /nobreak >nul

          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f >nul 2>&1
          reg add "HKCU\Control Panel\Desktop" /v DragFullWindows /t REG_SZ /d 0 /f >nul 2>&1
          reg add "HKCU\Control Panel\Desktop" /v FontSmoothing /t REG_SZ /d 0 /f >nul 2>&1

          mkdir "%APPDATA%\FileZilla" >nul 2>&1
          copy /y "C:\filezilla.xml" "%APPDATA%\FileZilla\filezilla.xml" >nul 2>&1
          copy /y "C:\layout.xml" "%APPDATA%\FileZilla\layout.xml" >nul 2>&1

          timeout /t 1 /nobreak >nul

          start "" "C:\Program Files\FileZilla FTP Client\filezilla.exe"
          start "" "C:\Users\Public\Desktop\Adobe Stock.lnk"
          start "" "C:\Users\Public\Desktop\AutoDownloader.exe"

          del "%~f0"
          exit
          '@
          Set-Content -Path "$startupDir\launch_apps.bat" -Value $batContent

      - name: Jalankan Tunnel, Kirim ke Google Sheets & Pantau Sisa Waktu
        shell: pwsh
        env:
          RDP_USER: ${{ github.event.inputs.customUsername || 'adminuser' }}
          RDP_PASS: ${{ github.event.inputs.customPassword || 'P@ssw0rdKu2026!' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwUXd6ZVeLkZULzI7QHibFUD9y4OnYRNG-jSrD56E7KrDWwmwX1Uq0Js-cEld2eu6Ok/exec"

          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
          Expand-Archive -Path "bore.zip" -DestinationPath "." -Force

          $proc = Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "bore.log" -RedirectStandardError "bore_err.log" -PassThru -NoNewWindow

          $rdpAddress = ""
          $portOnly = ""
          for ($i = 0; $i -lt 25; $i++) {
            Start-Sleep -Seconds 2
            $logs = ""
            if (Test-Path "bore.log") { $logs += Get-Content "bore.log" -Raw }
            if (Test-Path "bore_err.log") { $logs += Get-Content "bore_err.log" -Raw }

            if ($logs -match "bore\.pub:([0-9]+)") {
              $portOnly = $matches[1]
              $rdpAddress = "bore.pub:$portOnly"
              break
            }
          }

          if ([string]::IsNullOrEmpty($rdpAddress)) {
            Write-Error "Gagal mendeteksi port bore.pub"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Host "Tunnel aktif, mengirim data ke Google Sheets (Akun2)..."
          $payload = @{
            slot         = "akun2"
            host         = "bore.pub"
            port         = $portOnly
            full_address = $rdpAddress
            username     = $env:RDP_USER
            password     = $env:RDP_PASS
          } | ConvertTo-Json -Compress

          try {
            $resp = Invoke-RestMethod -Uri $WEBHOOK_URL -Method Post -Body $payload -ContentType "application/json" -TimeoutSec 15
            Write-Host "Status Google Sheets: $resp"
          } catch {
            Write-Host "Gagal mengirim ke Google Sheets: $_"
          }

          # === AMBIL WAKTU MULAI REAL DARI SERVER GITHUB ===
          $startUtc = (Get-Date).ToUniversalTime()
          $timeSource = "Runner Local (Fallback)"
          try {
            $headers = @{ "User-Agent" = "GitHub-Actions-Monitor" }
            if ($env:GH_TOKEN) { $headers["Authorization"] = "Bearer $env:GH_TOKEN" }
            $apiUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $runInfo = Invoke-RestMethod -Uri $apiUrl -Headers $headers -TimeoutSec 10
            if ($runInfo.run_started_at) {
              if ($runInfo.run_started_at -is [DateTime]) {
                $startUtc = $runInfo.run_started_at.ToUniversalTime()
              } else {
                $startUtc = [DateTimeOffset]::Parse([string]$runInfo.run_started_at).UtcDateTime
              }
              $timeSource = "GitHub Server API (Real)"
            }
          } catch {
            Write-Host "Info: Gagal membaca API waktu GitHub ($_)"
          }

          $maxLimitMinutes = 360
          $startWita = $startUtc.AddHours(8)
          $limit6JamWita = $startWita.AddMinutes($maxLimitMinutes)

          # Hitung jadwal auto-restart cron berikutnya (0 */5 * * * UTC -> 04:00, 08:00, 13:00, 18:00, 23:00 WITA)
          $cronHoursUtc = @(0, 5, 10, 15, 20)
          $nextCronHour = ($cronHoursUtc | Where-Object { $_ -gt $startUtc.Hour } | Select-Object -First 1)
          if ($null -eq $nextCronHour) {
            $nextCronUtc = $startUtc.Date.AddDays(1)
          } else {
            $nextCronUtc = $startUtc.Date.AddHours($nextCronHour)
          }
          $nextCronWita = $nextCronUtc.AddHours(8)

          Write-Host ""
          Write-Host "========================================================"
          Write-Host "MONITOR WAKTU REAL GITHUB ACTIONS (WITA)"
          Write-Host "--------------------------------------------------------"
          Write-Host "Sumber Waktu      : $timeSource"
          Write-Host "Run ID            : #$env:GITHUB_RUN_NUMBER ($env:GITHUB_RUN_ID)"
          Write-Host "Mulai Real        : $($startWita.ToString('dd/MM/yyyy HH:mm:ss')) WITA"
          Write-Host "Batas Mati 6 Jam  : $($limit6JamWita.ToString('dd/MM/yyyy HH:mm:ss')) WITA"
          Write-Host "Auto-Restart Cron : $($nextCronWita.ToString('dd/MM/yyyy HH:mm:ss')) WITA"
          Write-Host "========================================================"
          Write-Host ""

          $lastLogMinute = -5
          while (!$proc.HasExited) {
            $nowUtc = (Get-Date).ToUniversalTime()
            $nowWita = $nowUtc.AddHours(8)

            $elapsedMins = [math]::Max(0, [math]::Floor(($nowUtc - $startUtc).TotalMinutes))
            $sisa6JamMins = [math]::Max(0, $maxLimitMinutes - $elapsedMins)
            $sisaCronMins = [math]::Max(0, [math]::Floor(($nextCronUtc - $nowUtc).TotalMinutes))

            if (($elapsedMins - $lastLogMinute) -ge 5) {
              $lastLogMinute = $elapsedMins
              $eJ = [math]::Floor($elapsedMins / 60);  $eM = $elapsedMins % 60
              $rJ = [math]::Floor($sisa6JamMins / 60); $rM = $sisa6JamMins % 60
              $cJ = [math]::Floor($sisaCronMins / 60); $cM = $sisaCronMins % 60

              Write-Host "[$($nowWita.ToString('HH:mm:ss')) WITA] Jalan: ${eJ}j ${eM}m | Sisa Batas 6 Jam: ${rJ}j ${rM}m | Sisa ke Cron: ${cJ}j ${cM}m"
            }

            Start-Sleep -Seconds 15
          }
