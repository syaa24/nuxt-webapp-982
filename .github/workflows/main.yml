name: Self-Hosted Personal Workspace (Direct RDP)

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Pilih Versi OS Environment'
        required: true
        type: choice
        default: 'windows-latest'
        options:
          - windows-latest
          - windows-2025
          - windows-2022
      customUsername:
        description: 'Username Akses (Default: adminuser)'
        required: false
        default: 'adminuser'
      customPassword:
        description: 'Password Akses (Minimal 8 karakter kompleks)'
        required: true
        default: 'P@ssw0rdKu2026!'

permissions:
  contents: write

jobs:
  deploy-workspace:
    runs-on: ${{ github.event.inputs.osChoice || 'windows-latest' }}
    timeout-minutes: 360

    steps:
      - name: Unduh Isi Repositori
        uses: actions/checkout@v4

      - name: Konfigurasi User & Aktifkan RDP
        env:
          RDP_USER: ${{ github.event.inputs.customUsername || 'adminuser' }}
          RDP_PASS: ${{ github.event.inputs.customPassword }}
        run: |
          $securePassword = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $securePassword -FullName $env:RDP_USER -PasswordNeverExpires -ErrorAction Stop
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction Stop

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

      - name: Buat Direct TCP Tunnel & Simpan rdp-info.txt
        env:
          RDP_USER: ${{ github.event.inputs.customUsername || 'adminuser' }}
          RDP_PASS: ${{ github.event.inputs.customPassword }}
        run: |
          Start-Process -FilePath "ssh.exe" -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "tunnel.log" -RedirectStandardError "tunnel_err.log" -NoNewWindow
          
          $rdpAddress = ""
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path "tunnel.log") {
              $content = Get-Content "tunnel.log" -Raw
              if ($content -match "tcp://([a-zA-Z0-9.-]+:[0-9]+)") {
                $rdpAddress = $matches[1]
                break
              }
            }
          }

          if ([string]::IsNullOrEmpty($rdpAddress)) {
            $rdpAddress = "Gagal mendeteksi alamat, cek log Actions"
          }

          @"
          ==========================================
          INFORMASI LOGIN RDP LANGSUNG (DIRECT)
          ==========================================
          Alamat RDP : $rdpAddress
          Username   : $env:RDP_USER
          Password   : $env:RDP_PASS
          Dibuat     : $(Get-Date -Format "yyyy-MM-dd HH:mm:ss") UTC
          ==========================================
          "@ | Out-File -FilePath "rdp-info.txt" -Encoding utf8

      - name: Simpan rdp-info.txt ke Halaman Code Repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rdp-info.txt
          git commit -m "Update kredensial Direct RDP"
          git push

      - name: Jaga Sesi Tetap Aktif (Maksimal 6 Jam)
        run: |
          Write-Host "Direct RDP aktif. Silakan cek file rdp-info.txt di tab Code."
          Start-Sleep -Seconds 21500
