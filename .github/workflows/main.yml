name: Self-Hosted Personal Workspace

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Pilih Versi OS Environment'
        required: true
        type: choice
        default: 'windows-latest'
        options:
          - windows-latest
          - windows-2025
          - windows-2022
      customUsername:
        description: 'Username Akses (Default: adminuser)'
        required: false
        default: 'adminuser'
      customPassword:
        description: 'Password Akses (Minimal 8 karakter kompleks)'
        required: true
        default: 'P@ssw0rdKu2026!'

permissions:
  contents: write

jobs:
  deploy-workspace:
    runs-on: ${{ github.event.inputs.osChoice || 'windows-latest' }}
    timeout-minutes: 360

    steps:
      - name: Unduh Isi Repositori
        uses: actions/checkout@v4

      - name: Konfigurasi User & Aktifkan RDP
        env:
          RDP_USER: ${{ github.event.inputs.customUsername || 'adminuser' }}
          RDP_PASS: ${{ github.event.inputs.customPassword }}
        run: |
          $securePassword = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $securePassword -FullName $env:RDP_USER -PasswordNeverExpires -ErrorAction Stop
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction Stop

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

      - name: Jalankan Tunnel & Buat File rdp-info.txt
        env:
          RDP_USER: ${{ github.event.inputs.customUsername || 'adminuser' }}
          RDP_PASS: ${{ github.event.inputs.customPassword }}
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389 --logfile cloudflared.log" -NoNewWindow
          
          Start-Sleep -Seconds 10
          
          $tunnelLine = Select-String -Path "cloudflared.log" -Pattern "trycloudflare.com" | Select-Object -First 1
          $tunnelHost = if ($tunnelLine -match "https://([a-zA-Z0-9-]+\.trycloudflare\.com)") { $matches[1] } else { "Cek log Actions secara manual" }

          @"
          ==========================================
          INFORMASI LOGIN RDP AKTIF
          ==========================================
          Host Tunnel : $tunnelHost
          Perintah PC : cloudflared.exe access tcp --hostname $tunnelHost --url localhost:33890
          Alamat RDP  : localhost:33890
          Username    : $env:RDP_USER
          Password    : $env:RDP_PASS
          Dibuat Pada : $(Get-Date -Format "yyyy-MM-dd HH:mm:ss") UTC
          ==========================================
          "@ | Out-File -FilePath "rdp-info.txt" -Encoding utf8

      - name: Simpan rdp-info.txt ke Halaman Code Repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rdp-info.txt
          git commit -m "Update kredensial RDP aktif"
          git push

      - name: Jaga Sesi Tetap Aktif (Maksimal 6 Jam)
        run: |
          Write-Host "Workspace aktif. Silakan cek file rdp-info.txt di tab Code."
          Start-Sleep -Seconds 21500
