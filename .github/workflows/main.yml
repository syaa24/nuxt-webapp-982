name: Self-Hosted Personal Workspace (Direct RDP)

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Pilih Versi OS Environment'
        required: true
        type: choice
        default: 'windows-2022'
        options:
          - windows-2022
          - windows-2025
          - windows-latest
      customUsername:
        description: 'Username Akses (Default: adminuser)'
        required: false
        default: 'adminuser'
      customPassword:
        description: 'Password Akses (Minimal 8 karakter kompleks)'
        required: true
        default: 'P@ssw0rdKu2026!'
  # === AUTO-RESTART OTOMATIS TIAP 5 JAM ===
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: direct-rdp-akun2
  cancel-in-progress: true

jobs:
  deploy-workspace:
    runs-on: ${{ github.event.inputs.osChoice || 'windows-2022' }}
    timeout-minutes: 360

    steps:
      - name: Konfigurasi User & Aktifkan Layanan RDP
        shell: pwsh
        env:
          RDP_USER: ${{ github.event.inputs.customUsername || 'adminuser' }}
          RDP_PASS: ${{ github.event.inputs.customPassword || 'P@ssw0rdKu2026!' }}
        run: |
          $securePassword = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $securePassword -FullName $env:RDP_USER -PasswordNeverExpires -ErrorAction Stop
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction Stop
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER -ErrorAction SilentlyContinue

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Optimize Registry 4K
        shell: pwsh
        run: |
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $tsPath)) { New-Item -Path $tsPath -Force }
          Set-ItemProperty -Path $tsPath -Name "fEnableVirtualizedGraphics" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "MinFrameRate" -Value 120 -Type DWord
          Restart-Service -Name "TermService" -Force

      - name: Install FileZilla & Tools
        shell: pwsh
        run: |
          choco install filezilla -y --no-progress

          $downUrl = "https://www.dropbox.com/scl/fi/s4h2cp5he09gz2z3aoo5r/AutoDownloader.exe?rlkey=lntuysb790s6gg7ywgi66lvrx&st=nob074sf&dl=1"
          Invoke-WebRequest -Uri $downUrl -OutFile "C:\Users\Public\Desktop\AutoDownloader.exe" -UserAgent "Mozilla/5.0"

          $adobeUrl = "https://auth.services.adobe.com/en_US/index.html?callback=https%3A%2F%2Fims-na1.adobelogin.com%2Fims%2Fadobeid%2FAdobeStockContributor1%2FAdobeID%2Fcode%3Fredirect_uri%3Dhttps%253A%252F%252Fcontributor.stock.adobe.com%252F%253Fisa0%253D1%26code_challenge_method%3Dplain%26use_ms_for_expiry%3Dtrue&client_id=AdobeStockContributor1&scope=AdobeID%2Copenid%2Ccreative_cloud%2Ccreative_sdk%2Ccc_private%2Cgnav%2Csao.stock%2Cadditional_info.address.mail_to%2Cadditional_info.roles%2Cread_organizations%2Cread_pc.stock%2Csao.cce_private%2Cpps.read%2Csecurity_phone.status.r%2Cportfolio.sdk.import&relay=681b1aaa-4524-429d-a843-bd82c376f9b6&locale=en_US&flow_type=code&dctx_id=v%3A2%2Cs%2Cad62dff0-679d-11f0-ae3d-077325bce27&idp_flow_type=login&ab_test=welcome-back&s_p=google%2Cfacebook&response_type=code&code_challenge_method=plain&redirect_uri=https%3A%2F%2Fcontributor.stock.adobe.com%2F%3Fisa0%253D1&use_ms_for_expiry=true#/"
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          $wshell = New-Object -ComObject WScript.Shell
          $shortcut = $wshell.CreateShortcut("C:\Users\Public\Desktop\Adobe Stock.lnk")
          $shortcut.TargetPath = $chromePath
          $shortcut.Arguments = "--incognito `"$adobeUrl`""
          $shortcut.Save()

      - name: Generate Master XML Config FileZilla (Full Settings Asli)
        shell: pwsh
        env:
          RDP_USER: ${{ github.event.inputs.customUsername || 'adminuser' }}
        run: |
          # 1. filezilla.xml lengkap dengan bypass popup Welcome & LocalPath dinamis sesuai RDP_USER
          $fzXml = @'
          <?xml version="1.0"?>
          <FileZilla3 version="3.71.1" platform="windows">
